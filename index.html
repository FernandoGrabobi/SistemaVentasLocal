<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Punto de Venta</title>
  <link rel="stylesheet" href="./css/output.css" />
</head>
<body class="h-screen w-screen overflow-hidden bg-gray-50 text-gray-900">
  <div class="flex h-full w-full">
    <!-- Sidebar -->
    <aside class="flex w-56 shrink-0 flex-col border-r border-gray-200 bg-white">
      <div class="flex items-center gap-2 border-b border-gray-100 px-4 py-4">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white font-bold">PV</div>
        <div>
          <div class="text-sm font-semibold leading-tight">Punto de Venta</div>
          <div class="text-xs text-gray-400">Sistema local</div>
        </div>
      </div>
      <nav class="flex flex-1 flex-col gap-1 p-3" id="nav">
        <button class="nav-item" data-page="pos">🧾 Venta</button>
        <button class="nav-item" data-page="caja">💰 Caja</button>
        <button class="nav-item" data-page="stock">📦 Stock</button>
        <button class="nav-item" data-page="clientes">👤 Clientes</button>
        <button class="nav-item" data-page="catalogos">🏷️ Proveedores</button>
        <button class="nav-item" data-page="precios">💲 Precios</button>
        <button class="nav-item" data-page="reportes">📊 Reportes</button>
      </nav>
      <div class="border-t border-gray-100 p-3 text-xs text-gray-400">v1.0.0</div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      <div id="page-root" class="h-full"></div>
    </main>
  </div>

  <!-- Contenedor global de notificaciones (toasts) -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <style>
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 0.5rem;
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-align: left;
      color: #4b5563;
    }
    .nav-item:hover {
      background-color: #f3f4f6;
    }
    .nav-item.active {
      background-color: #eff6ff;
      color: #1d4ed8;
    }

    #ticket-print { display: none; }

    @media print {
      body * {
        visibility: hidden;
      }
      #ticket-print:not(.hidden), #ticket-print:not(.hidden) * {
        visibility: visible;
        display: block;
      }
      #ticket-print {
        position: absolute;
        top: 0;
        left: 0;
      }
    }
  </style>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
